function tpack(){const d=[["CC","Conhecimento do Conteúdo","O saber científico/técnico do eixo tecnológico: o conceito ou a técnica que o estudante precisa se apropriar."],["CP","Conhecimento Pedagógico","A intencionalidade crítica: metodologias ativas, problematização da realidade e leitura do mundo do trabalho (Pedagogia Histórico-Crítica)."],["CT","Conhecimento Tecnológico","A ferramenta digital escolhida — priorizando software livre, simuladores e opções de baixa conectividade."],["CD","Conhecimento de Design","Como a atividade é arquitetada para garantir acessibilidade física, atitudinal e cognitiva (DUA)."],["CS","Contexto Sociopolítico","A dimensão que envolve e determina todas as demais: as condições reais de trabalho, infraestrutura e emancipação da comunidade escolar."]];

const GCP=[CP["Aprendizagem Baseada"],CP["invertida"],CP["Debate"],CP["contradições"],CP["Oficina"],"Defina com a turma um produto que atenda a uma necessidade da comunidade. Planeje etapas e prazos, entregue a quem precisa e feche com avaliação conjunta do retorno.","Peça que cada estudante traga uma experiência (própria ou de conhecido) com trabalho por aplicativo. Organize a conversa em círculo, registre os pontos em comum e relacione-os a direitos.","Apresente um caso em que um algoritmo gerou resultado injusto. Em grupos, a turma identifica quem decide e quem é afetado e propõe uma mudança no código ou na regra.","Dê dois casos de organização, uma tradicional e uma cooperativa. A turma compara quem decide, quem ganha e como o processo é controlado.","Monte uma simulação com papéis de atendente e usuário. Depois discuta quais direitos foram respeitados e o que a pressão por produtividade muda.","Combine uma visita ou entrevista com trabalhador(a) ou artesão(ã) local. A turma registra o saber da pessoa e propõe como a tecnologia pode apoiá-lo, sem substituí-lo.","Analise peças reais da indústria criativa e pergunte quem produz, quem lucra e quem é representado. Conclua com um posicionamento escrito da turma.","Escolha um insumo regional e peça que a turma rastreie de onde vem, quem produz e como chega ao prato. Registre em um mapa ou linha do tempo.","Abra com uma pergunta sobre o que a turma come e de onde vem. Use dados locais sobre acesso a alimentos e feche com propostas de ação."];

const GCD=["Combine os formatos de entrega com antecedência (oral, escrito, protótipo) e avalie pelos mesmos critérios.","Revise contraste, tamanho de fonte e ordem de leitura; teste com leitor de tela antes da aula.","Tenha amostras ou materiais físicos à mão para quem não puder usar tela.","Divida em etapas curtas e escreva a meta de cada etapa no quadro.","Ofereça 2 a 3 temas e deixe a turma escolher, desde que cumpram os mesmos objetivos.","Entregue o mesmo tutorial em texto, áudio e vídeo com legenda.","Imprima a atividade e deixe pronta uma versão sem internet.","Deixe o NVDA instalado e testado no laboratório e avise a turma antes.","Grave o roteiro em áudio curto e disponibilize junto com o texto.","Mostre os critérios no início e avalie o que foi aprendido, seja qual for o formato.","Defina com antecedência quem precisa de mais tempo e planeje atividades de extensão sem expor ninguém.","Deixe a turma escolher entre trabalhar sozinha, em dupla ou em trio, mantendo papéis claros.","Comece em blocos visuais e só depois mostre o código equivalente.","Leve amostras de material para toque e peça descrição oral do que sentem.","Prepare o roteiro com foto de cada passo e texto curto.","Use modelos com cor e texto ao mesmo tempo, para que a cor não seja o único sinal."];
const GCS=["Pense toda atividade para celular: telas simples, arquivos leves e nada que dependa de computador em casa.","Deixe a versão offline pronta, baixe os arquivos antes da aula e tenha plano B em papel.","Organize em duplas ou trios e alterne o uso dos aparelhos; prepare tarefas que dispensem tela.","Converse antes com a coordenação ou o AEE sobre as necessidades da turma e adapte os materiais desde o planejamento.","Traga um caso de produção local e, se possível, convide agricultores ou cooperativas.","Calcule o tempo real da aula (chegada, intervalo, imprevistos) e divida a atividade em partes que caibam.","Use exemplos de entregadores ou motoristas de aplicativo e relacione com direitos e condições de trabalho.","Pergunte quem controla as ferramentas que a turma usa e que alternativas livres existem.","Reconheça a cobrança por formação rápida e mostre por que a formação crítica também conta no emprego.","Contraste a lógica de mercado com o interesse público, usando um serviço público ou uma cooperativa conhecidos.","Convide quem detém o saber (artesão, cozinheira) e trate-o como fonte de conhecimento, não como exemplo.","Peça que a turma levante resíduos, água e energia do processo produtivo local e proponha uma melhoria.","Substitua insumos caros por regionais e discuta o custo real com a turma.","Planeje receitas e atividades conforme a safra e a seca, usando insumos da época."];
const sp=(id,a,v)=>{const i=F.find(f=>f[0]===id)[2].indexOf(v);return i>=0?a[i]:null},tx=(id,a,v)=>{const s=sp(id,a,v);return s?" "+esc(s):""};
function roteiro(){const cc=val("g_cc"),cs=val("g_cs"),cp=val("g_cp"),ct=val("g_ct"),cd=val("g_cd"),h=val("g_componente");const all=D.map((g,i)=>S.d[i].map(j=>[g[2][j],H[i][j]])).flat().concat(S.o.map(x=>x.trim()?[x.trim(),"Estratégia definida por você."]:null).filter(Boolean));
return `<div class="road"><h3>1. Antes da aula</h3><p><b>Conteúdo${cc?` — ${esc(cc)}`:""}.</b>${cc?(tx("g_cc",GCC,cc)||" Revise o conteúdo e prepare um exemplo do cotidiano da turma."):" Escolha o CC (Etapa 1) para ver a orientação."}</p><p><b>Realidade da turma${cs?` — ${esc(cs)}`:""}.</b>${cs?(tx("g_cs",GCS,cs)||" Confira essa condição com a turma e deixe pronto um plano B (papel/offline)."):" Escolha o CS (Etapa 2) para ver a orientação."}${h?` Carga horária prevista: ${esc(h)}.`:""}</p>
<h3>2. Abertura — intencionalidade pedagógica</h3><p>${cp?(esc(sp("g_cp",GCP,cp)||`Conduza “${cp}” com um problema do contexto local, momentos de discussão e síntese coletiva.`)):"Escolha o CP (Etapa 2) para ver a orientação."}</p>
<h3>3. Desenvolvimento — ferramenta e flexibilização</h3><p>${ct?esc(sp("g_ct",GCT,ct)||`Apresente “${ct}” com uma demonstração curta, deixe a turma explorar em duplas e combine onde tirar dúvidas.`):"Escolha o CT (Etapa 2) para ver a orientação."}</p>${cd?`<p><b>Flexibilização — ${esc(cd)}.</b>${tx("g_cd",GCD,cd)}</p>`:""}
<h3>4. Estratégias DUA — como aplicar</h3>${all.length?"<ul>"+all.map(x=>`<li><b>${esc(x[0])}</b><br>${esc(x[1])}</li>`).join("")+"</ul>":"<p>Nenhuma estratégia escolhida ainda.</p>"}<h3>5. Avaliação</h3><p>Compartilhe a rubrica antes da produção e avalie a aprendizagem alcançada, não o formato de entrega.</p><h3>6. Fechamento</h3><p>Reserve um momento de reflexão crítica${cs?` ligando a atividade ao contexto: ${esc(cs)}`:" sobre o contexto social e de trabalho"}.</p></div>`}
function resumoBody(){return `<h2>Resumo do Plano de Aula — SFAP / TPACK-R</h2><dl>${F.map(f=>`<dt>${esc(f[1])}</dt><dd>${esc(val(f[0]))||"—"}</dd>`).join("")}<dt>Critérios DUA contemplados</dt><dd>${DUAK.filter((k,i)=>S.crit[i]).join(" · ")||"—"}</dd>${D.map((g,i)=>`<dt>DUA — ${esc(g[1])}</dt><dd>${S.d[i].map(j=>esc(g[2][j])).concat(S.o[i].trim()?[esc(S.o[i].trim())]:[]).join("<br>")||"—"}</dd>`).join("")}</dl>${roteiro()}`}

const V={home,tpack,recursos,planos,gerador,resumo,contato};
function render(){$("#nav").innerHTML=NAV.map(n=>`<button data-go="${n[0]}" class="${n[0]===S.route?"on":""}">${n[1]}</button>`).join("");$("#app").innerHTML=V[S.route]();window.scrollTo(0,0)}
function copyPlan(i){const p=plans[i],m={CC:"g_cc",CP:"g_cp",CT:"g_ct",CD:"g_cd",CS:"g_cs"};S.v.g_tema=p.tema;p.tp.forEach(t=>S.v[m[t[0]]]=t[2]);S.route="gerador";S.step=0;save();render()}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset;
if(k.copy!==undefined)return copyPlan(+k.copy);
if(k.plan!==undefined&&!k.go){S.plan=+k.plan;return render()}
if(k.eixo){S.eixo=k.eixo;return render()}
if(k.d){const[i,j]=k.d.split(",").map(Number),s=S.d[i],x=s.indexOf(j);x<0?s.push(j):s.splice(x,1);b.classList.toggle("on");return save()}
if(k.step!==undefined){S.route="gerador";S.step=+k.step;save();return render()}
if(k.go){S.route=k.go==="dua"?"gerador":k.go;if(k.go==="dua")S.step=2;if(k.step!==undefined)S.step=+k.step;if(k.plan!==undefined)S.plan=null;save();return render()}

if(b.id==="dl"){try{const doc=`<!doctype html><meta charset="utf-8"><title>Resumo SFAP</title><style>body{font:14px/1.5 system-ui,sans-serif;max-width:760px;margin:20px auto;padding:0 16px;color:#000}h2,h3,dt{color:#00693E}dt{font-weight:700;margin-top:8px}dd{margin:0;border-bottom:1px solid #999}.road{border:1px solid #999;border-radius:8px;padding:4px 14px}@media print{.np{display:none}}</style><button class="np" onclick="print()" style="padding:8px 14px;margin:8px 0">Imprimir</button>${resumoBody()}<script>addEventListener("load",()=>setTimeout(()=>{try{print()}catch(e){}},400))<\/script>`;const u=URL.createObjectURL(new Blob([doc],{type:"text/html"})),a=document.createElement("a");a.href=u;a.download="resumo-plano-SFAP.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(x){$("#msg").textContent="Não foi possível baixar o arquivo. Use o botão Imprimir ou Ctrl+P (Cmd+P no Mac)."}}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.f){const id=t.dataset.f,o=$("#"+id+"_o");if(t.value==="__o"){o.classList.remove("hid");o.focus();S.v[id]=o.value}else{o.classList.add("hid");S.v[id]=t.value}save()}if(t.dataset.c!==undefined){S.crit[+t.dataset.c]=t.checked?1:0;save()}});
document.addEventListener("input",e=>{const t=e.target;if(t.id&&t.id.endsWith("_o")){S.v[t.id.slice(0,-2)]=t.value;save()}if(t.dataset.o!==undefined){S.o[+t.dataset.o]=t.value;save()}});
